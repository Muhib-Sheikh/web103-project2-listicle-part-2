<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Avalon Role Guide</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />

    <link rel="stylesheet" href="/style.css" />

    <script defer src="/scripts/header.js"></script>
    <script defer src="/scripts/role.js"></script>
  </head>

  <body>
    <header class="container"></header>

    <main id="role-content" class="container role-detail">
      <div>
        <img id="role-image" src="" alt="" />
      </div>

      <article class="role-details">
        <h2 id="role-name"></h2>

        <p id="role-allegiance"></p>
        <p id="role-type"></p>
        <p id="role-card-text"></p>
        <p id="role-description"></p>

        <hr />

        <small id="role-id"></small>
        <br />
        <small id="role-slug"></small>
      </article>
    </main>
  </body>
</html>
